<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Ukrainian Transliterator</title>
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>

<header class="app-header">
  <div class="brand"><span class="brand-badge">UA</span> Transliterator</div>
  <div class="controls">
    <div class="segmented-control">
      <button class="segment-btn active" id="btn-lat2cyr">LAT → УКР</button>
      <button class="segment-btn" id="btn-cyr2lat">УКР → LAT</button>
    </div>
    <div class="segmented-control">
      <button class="segment-btn active" id="theme-dark">Dark</button>
      <button class="segment-btn" id="theme-light">Light</button>
    </div>
  </div>
</header>

<main class="app-main">
  <section class="editor-panel">
    <div class="editor-toolbar">
      <span class="toolbar-label" id="editor-lbl">Input Buffer (Latin)</span>
      <div class="cheatsheet">
        <kbd>s</kbd>→с <kbd>sh</kbd>→ш <kbd>shh</kbd>→щ <kbd>zh</kbd>→ж <kbd>ch</kbd>→ч <kbd>+</kbd> escape
      </div>
    </div>

    <div class="editor-container">
      <div id="lt-overlay" class="editor-layer" aria-hidden="true"></div>
      <textarea id="ta" class="editor-layer" placeholder="Pryvit, svite..." spellcheck="false" autocomplete="off"></textarea>
    </div>

    <div class="editor-statusbar">
      <div class="status-indicator">
        <div class="status-dot" id="grammar-dot"></div>
        <span id="grammar-msg">correction standby</span>
      </div>
      <div><span id="ccount">0</span> characters</div>
    </div>

    <div class="editor-actions">
      <button class="btn btn-primary" id="btn-to-cyr">To Cyrillic</button>
      <button class="btn btn-primary" id="btn-to-lat">To Latin</button>
      <button class="btn btn-secondary" id="btn-grammar">Grammar Check</button>
      <button class="btn btn-secondary btn-spacer" id="btn-copy">Copy</button>
      <button class="btn btn-secondary" id="btn-clear">Flush</button>
    </div>
  </section>

  <aside class="sidebar">
    <div class="sidebar-header">Character Matrix Mapping</div>
    <div class="char-grid" id="char-grid"></div>
  </aside>
</main>

<footer class="app-footer">
  <span>
    <a href="https://github.com/yaro-bit" target="_blank" rel="noopener">@yaro-bit</a> |
    <a href="https://languagetool.org" target="_blank" rel="noopener">LanguageTool Integration</a>
  </span>
</footer>

<div id="lt-dropdown"></div>
<div class="toast" id="toast">Pipeline buffer copied successfully.</div>

</body>
</html>
